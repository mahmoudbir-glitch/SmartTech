<!doctype html>
<html lang="ar" dir="rtl" data-title-key="admin.pageTitle" data-default-lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title></title>
<link rel="stylesheet" href="/admin.css?v=bbf9fb36">
<!--
  The console loads neither i18n.js nor catalog.js nor core.js.
  i18n.js because 41% of it is this page's own copy and the shop should not
  carry it; catalog.js because the list is paged from the server, so the
  browser never holds 312 products (11.5KB gz today, ~110KB at 3,000) to show
  forty rows.
-->
<script src="/i18n-admin.js?v=5132651c"></script>
</head>
<body>

<a class="skip-link" href="#main" data-i18n="admin.skipToContent"></a>

<div id="app-root">

  <section id="loginView" class="login-wrap" hidden>
    <form id="loginForm" class="card login">
      <div class="logo" dir="ltr"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.5 2 4.5 13.5h6L9.5 22l9-11.5h-6z" fill="currentColor"></path></svg><span class="word">Smart<b>Tech</b></span></div>
      <h1 data-i18n="admin.title"></h1>
      <p class="muted" data-i18n="admin.loginHint"></p>
      <label class="field"><span data-i18n="admin.userName"></span>
        <input id="loginUser" autocomplete="username" dir="ltr">
      </label>
      <label class="field"><span data-i18n="admin.password"></span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn--primary btn--block" id="loginBtn" data-i18n="admin.login"></button>
      <div id="loginMsg" class="msg" role="alert" aria-live="assertive"></div>
      <select id="loginLanguage" class="lang-select" data-i18n-attr="aria-label:admin.languageLabel"></select>
    </form>
  </section>

  <div id="adminView" class="shell" hidden>

    <!-- Desktop: a 232px rail. Phone: this whole element is off-screen and the
         bottom bar takes over, so chrome before content is 48px, not 281px. -->
    <nav id="rail" class="rail" aria-label="" data-i18n-attr="aria-label:admin.menu">
      <div class="rail__head">
        <span class="logo" dir="ltr"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.5 2 4.5 13.5h6L9.5 22l9-11.5h-6z" fill="currentColor"></path></svg><span class="word">Smart<b>Tech</b></span></span>
        <button type="button" id="railToggle" class="icon-btn icon-btn--rail" data-i18n-attr="aria-label:admin.collapseRail" aria-expanded="true"></button>
      </div>
      <div class="rail__groups" id="railGroups"></div>
      <div class="rail__foot">
        <select id="languageSelect" class="lang-select" data-i18n-attr="aria-label:admin.languageLabel"></select>
        <a href="/" target="_blank" rel="noopener" class="btn btn--ghost btn--sm" data-i18n="admin.viewStore"></a>
        <button type="button" id="logoutBtn" class="btn btn--ghost btn--sm" data-i18n="admin.logout"></button>
      </div>
    </nav>

    <div class="pane">
      <header class="topbar">
        <button type="button" id="backBtn" class="icon-btn icon-btn--back" data-i18n-attr="aria-label:admin.back" hidden></button>
        <h1 id="screenTitle" class="topbar__title"></h1>
        <div class="topbar__actions">
          <button type="button" id="helpBtn" class="icon-btn icon-btn--help" data-i18n-attr="aria-label:admin.kbdTitle"></button>
        </div>
      </header>

      <main id="main" class="screens" tabindex="-1">
        <section id="screen-orders"   class="screen" hidden></section>
        <section id="screen-customers" class="screen" hidden></section>
        <section id="screen-products" class="screen" hidden></section>
        <section id="screen-taxonomy" class="screen" hidden></section>
        <section id="screen-stock"    class="screen" hidden></section>
        <section id="screen-pricing"  class="screen" hidden></section>
        <section id="screen-media"    class="screen" hidden></section>
        <section id="screen-content"  class="screen" hidden></section>
        <section id="screen-reports"  class="screen" hidden></section>
        <section id="screen-users"    class="screen" hidden></section>
        <section id="screen-backups"  class="screen" hidden></section>
        <section id="screen-settings" class="screen" hidden></section>
      </main>
    </div>

    <!-- Five destinations, orders first: that is what the owner opens the
         console for. Everything else is behind "more". -->
    <nav id="bottombar" class="bottombar" aria-label="" data-i18n-attr="aria-label:admin.menu"></nav>
  </div>

</div>

<!-- Dialogs are siblings of #app-root, never inside it. -->
<dialog id="editor" class="sheet sheet--full" aria-labelledby="editorTitle">
  <div class="sheet__head">
    <h2 id="editorTitle"></h2>
    <button type="button" class="icon-btn icon-btn--close" data-close data-i18n-attr="aria-label:admin.closeLabel"></button>
  </div>
  <div class="sheet__body" id="editorBody"></div>
  <div class="sheet__foot" id="editorFoot"></div>
</dialog>

<dialog id="order" class="sheet sheet--end" aria-labelledby="orderTitle">
  <div class="sheet__head">
    <h2 id="orderTitle"></h2>
    <button type="button" class="icon-btn icon-btn--close" data-close data-i18n-attr="aria-label:admin.closeLabel"></button>
  </div>
  <div class="sheet__body" id="orderBody"></div>
  <div class="sheet__foot" id="orderFoot"></div>
</dialog>

<dialog id="sheet" class="sheet sheet--bottom" aria-labelledby="sheetTitle">
  <div class="sheet__head">
    <h2 id="sheetTitle"></h2>
    <button type="button" class="icon-btn icon-btn--close" data-close data-i18n-attr="aria-label:admin.closeLabel"></button>
  </div>
  <div class="sheet__body" id="sheetBody"></div>
  <div class="sheet__foot" id="sheetFoot"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div class="vh" id="sr-status" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="vh" id="sr-results" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="vh" id="sr-busy" role="status" aria-live="polite"></div>
<div class="vh" id="sr-route" role="status" aria-live="polite"></div>
<div class="vh" id="sr-error" role="alert"></div>

<script src="/admin.js?v=cfa74adf"></script>
</body>
</html>
