<svg xmlns="http://www.w3.org/2000/svg">
<!--
  SYRIATECH icon set.
  24×24 grid, 20×20 live area, outlined at stroke-width 1.75, round caps and
  joins, fill:none, currentColor. Outlined rather than filled because filled
  glyphs are heavier than the Cairo 700 text beside them, and a filled 24px
  glyph loses its counters at 16px while a stroked one just gets thinner.
  One concept per icon; composition (a count bubble over a cart) is done in
  CSS, never welded into the path.
  Directional icons are drawn pointing end-ward and mirrored by the flip class.

  The root <svg> carries NO width, height or display. Both `display:none` and
  `width="0" height="0"` on it stop an external use of icons.svg#id from
  instancing anything — measured in the target Chrome, both produce an empty
  box while the file itself returns 200. Nobody opens this file directly, so
  it needs no hiding. Do not "tidy" a size back onto it.
-->
<symbol id="ic-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="ic-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.1 10.2a2 2 0 0 0 2 1.6h7.5a2 2 0 0 0 2-1.6L20 7H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></symbol>
<symbol id="ic-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-9.4A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20Z"/></symbol>
